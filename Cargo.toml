[workspace]
members = [
  "crates/readmesh-core",
  "crates/readmesh-store",
  "crates/readmesh-plugin",
  "crates/readmesh-net",
  "crates/readmesh-transport",
  "crates/readmesh-metalink",
  "crates/readmesh-sync",
  "crates/readmesh-daemon",
  "crates/readmesh-rpc",
  "crates/readmesh-app",
  "crates/readmesh-cli",
  "crates/readmesh-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/readmesh/readmesh"
rust-version = "1.83"

[workspace.dependencies]
# async
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

# hashing
blake3 = { version = "1", features = ["serde"] }

# error handling
thiserror = "2"
anyhow = "1"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# uuid
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# time
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# bytes
bytes = "1"

# internal crates
readmesh-core = { path = "crates/readmesh-core" }
readmesh-store = { path = "crates/readmesh-store" }
readmesh-plugin = { path = "crates/readmesh-plugin" }
readmesh-net = { path = "crates/readmesh-net" }
readmesh-transport = { path = "crates/readmesh-transport" }
readmesh-metalink = { path = "crates/readmesh-metalink" }
readmesh-sync = { path = "crates/readmesh-sync" }
readmesh-rpc = { path = "crates/readmesh-rpc" }
readmesh-daemon = { path = "crates/readmesh-daemon" }
readmesh-app = { path = "crates/readmesh-app" }
readmesh-cli = { path = "crates/readmesh-cli" }
readmesh-ui = { path = "crates/readmesh-ui" }

# UI (pinned Makepad 2.0 dev branch)
makepad-widgets = { git = "https://github.com/makepad/makepad.git", rev = "b41e7404b6bb893d32f7d2924cd7b1c28983547f" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
