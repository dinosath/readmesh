# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# hashing for verification
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }
tracing-subscriber.workspace = true
