[package]
name = "readmesh-cli"
description = "ReadMesh command-line client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "readmesh-cli"
path = "src/main.rs"

[dependencies]
readmesh-core.workspace = true
