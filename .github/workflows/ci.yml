name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libxkbcommon-dev libwayland-dev libpango1.0-dev libx11-xcb-dev libxcb-dri2-0-dev libxcb-xfixes0-dev libxcb-present-dev libxcb-sync-dev libxshmfence-dev libgl1-mesa-dev libx11-dev libxcursor-dev libasound2-dev libpulse-dev libssl-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libxkbcommon-dev libwayland-dev libpango1.0-dev libx11-xcb-dev libxcb-dri2-0-dev libxcb-xfixes0-dev libxcb-present-dev libxcb-sync-dev libxshmfence-dev libgl1-mesa-dev libx11-dev libxcursor-dev libasound2-dev libpulse-dev libssl-dev
      - name: Build
        run: cargo test --workspace --no-run
      - name: Unit & application-logic tests
        run: cargo test --workspace

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libxkbcommon-dev libwayland-dev libpango1.0-dev libx11-xcb-dev libxcb-dri2-0-dev libxcb-xfixes0-dev libxcb-present-dev libxcb-sync-dev libxshmfence-dev libgl1-mesa-dev libx11-dev libxcursor-dev libasound2-dev libpulse-dev libssl-dev
      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov.info
          path: lcov.info

  ui-tests:
    name: Makepad UI smoke tests (macOS)
    runs-on: macos-latest
    # The makepad-test harness is currently validated upstream on macOS only;
    # keep this signal visible without blocking the pipeline.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run UI smoke tests
        run: cargo test -p readmesh-ui --test ui
