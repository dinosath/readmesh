name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build release binaries
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libxkbcommon-dev libwayland-dev libpango1.0-dev libx11-xcb-dev libxcb-dri2-0-dev libxcb-xfixes0-dev libxcb-present-dev libxcb-sync-dev libxshmfence-dev libgl1-mesa-dev
      - name: Build release
        run: cargo build --workspace --release
      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/lnreaderd*
            target/release/lnreader*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
