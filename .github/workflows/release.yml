name: Release

# Tagged release: builds all platform artifacts via builds.yml, then
# publishes them on a GitHub release.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build platform artifacts
    uses: ./.github/workflows/builds.yml

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/readmesh-linux-x86_64/readmesh-linux-x86_64.tar.gz
            artifacts/readmesh-windows-x86_64/readmesh-windows-x86_64.zip
            artifacts/readmesh-macos-aarch64/readmesh-macos-aarch64.zip
            artifacts/readmesh-android-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
